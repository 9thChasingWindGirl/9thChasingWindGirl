# =============================================================================
# CYBERPUNK METRICS — GitHub Profile Infographics
# Design System: CyberPunk (#FCEE0A, #00F0FF, #0A0A0A)
# Generator: lowlighter/metrics@latest
#
# REQUIRED SECRET: METRICS_TOKEN (GitHub PAT with read:user, read:org, repo)
# =============================================================================
name: CYBERPUNK_METRICS

on:
  schedule:
    - cron: "0 0 * * *"          # Daily auto-update
  workflow_dispatch:              # Manual trigger
  push:
    branches: ["main", "master"]

# Required for lowlighter/metrics to push SVGs back to the repo
permissions:
  contents: write

jobs:
  # ===========================================================================
  # CYBERPUNK THEME PALETTE — Injected into all SVGs via input parameters
  # ===========================================================================
  # PRIMARY     #FCEE0A  yellow   — title, accent, highlight
  # ACCENT      #00F0FF  cyan     — secondary, link, line
  # DANGER      #FF003C  red      — danger, repo additions
  # SUCCESS     #39D353  green    — success states
  # BG          #0A0A0A  near-black
  # SURFACE     #141311  card bg
  # BORDER      #2F2E2A  border
  # TEXT        #F5F4F0  primary text
  # MUTED       #A8A499  secondary text

  # ===========================================================================
  # JOB 1: BASE METRICS (Header + Stats + Repositories)
  # ===========================================================================
  base-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate base metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update base metrics"
          user: 9thChasingWindGirl
          template: classic
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner
          repositories_skipped: 9thChasingWindGirl
          config_timezone: Asia/Hong_Kong
          config_display: regular
          config_padding: 16, 24
          config_animations: no
          # Color overrides via plugin metadata
          plugin_topics: yes
          plugin_repositories: yes
          plugin_repositories_featured: >-
            PopSmoke,
            viteGallery_Sample,
            dev-cleaner-zh-cn,
            Ryzenintosh_B550M-5900X-6900XT-AX200,
            mihomo.party

  # ===========================================================================
  # JOB 2: ISOMETRIC COMMIT CALENDAR
  # ===========================================================================
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate isocalendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update isocalendar"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 3: LANGUAGES ACTIVITY
  # ===========================================================================
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update languages"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_other: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 30
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 4: GITHUB ACHIEVEMENTS
  # ===========================================================================
  achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update achievements"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 8
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 5: CODING HABITS & ACTIVITY
  # ===========================================================================
  habits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update habits"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_from: both
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 6: LINES OF CODE CHANGED
  # ===========================================================================
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate lines
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update lines"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 3
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 7: RECENT ACTIVITY
  # ===========================================================================
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update activity"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          plugin_activity_filter: push, issue, pr, release, fork, star, review, comment
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 8: NOTABLE CONTRIBUTIONS
  # ===========================================================================
  notable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate notable
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update notable"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_notable: yes
          plugin_notable_indepth: no
          plugin_notable_types: commit, pull_request, issue, repository
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 9: FOLLOW-UP (Issues & PRs)
  # ===========================================================================
  followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate followup
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update followup"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: no
          plugin_followup_archived: yes
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no

  # ===========================================================================
  # JOB 10: STARRED TOPICS
  # ===========================================================================
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate topics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore(metrics): update topics"
          user: 9thChasingWindGirl
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12
          config_timezone: Asia/Hong_Kong
          config_padding: 16, 24
          config_animations: no